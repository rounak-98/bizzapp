{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}BizApp - Online Quotation & Invoice Maker{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <script>
        // Prevent theme flicker on page load
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.add('light-mode');
            }
        })();
    </script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="{% url 'dashboard' %}" class="logo">
            <i class="fa-solid fa-file-invoice-dollar"></i> Biz<span>App</span> QuoteMaker
        </a>
        <span class="nav-toggle" aria-label="Toggle navigation"><i class="fa fa-bars"></i></span>
        <ul class="nav-links">
            <li><a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <i class="fa fa-home"></i> Dashboard</a></li>
            <li><a href="{% url 'quotation_list' %}" class="{% if request.resolver_match.url_name == 'quotation_list' %}active{% endif %}">
                <i class="fa fa-file-alt"></i> Quotations</a></li>
            <li><a href="{% url 'invoice_list' %}" class="{% if request.resolver_match.url_name == 'invoice_list' %}active{% endif %}">
                <i class="fa fa-file-invoice"></i> Invoices</a></li>
            <li><a href="{% url 'customer_list' %}" class="{% if request.resolver_match.url_name == 'customer_list' %}active{% endif %}">
                <i class="fa fa-users"></i> Customers</a></li>
            <li><a href="{% url 'item_list' %}" class="{% if request.resolver_match.url_name == 'item_list' %}active{% endif %}">
                <i class="fa fa-box"></i> Items</a></li>
            <li><a href="{% url 'company_info' %}" class="{% if request.resolver_match.url_name == 'company_info' %}active{% endif %}">
                <i class="fa fa-building"></i> Company</a></li>
            <li><a href="{% url 'create_quotation' %}" class="btn-nav">
                <i class="fa fa-plus"></i> New Quote</a></li>
            <li>
                <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Dark / Light Mode" type="button">
                    <i class="fa-solid fa-moon" id="theme-icon"></i>
                </button>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 BizApp Quotation & Invoice Maker. All rights reserved.</p>
    </footer>

    <script>
      const toggle = document.querySelector('.nav-toggle');
      const navLinks = document.querySelector('.nav-links');
      if (toggle) {
        toggle.addEventListener('click', () => {
          navLinks.classList.toggle('show');
        });
      }

      // Theme Switcher Logic (Light / Dark Mode)
      const themeBtn = document.getElementById('theme-toggle');
      const themeIcon = document.getElementById('theme-icon');

      function updateThemeUI() {
        const isLight = document.body.classList.contains('light-mode') || document.documentElement.classList.contains('light-mode');
        if (isLight) {
          document.body.classList.add('light-mode');
          if (themeIcon) themeIcon.className = 'fa-solid fa-sun';
        } else {
          document.body.classList.remove('light-mode');
          if (themeIcon) themeIcon.className = 'fa-solid fa-moon';
        }
      }

      updateThemeUI();

      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          const isLightNow = document.body.classList.toggle('light-mode');
          document.documentElement.classList.toggle('light-mode', isLightNow);
          localStorage.setItem('theme', isLightNow ? 'light' : 'dark');
          updateThemeUI();
        });
      }
    </script>
</body>
</html>
