{% extends 'base.html' %}
{% block title %}Add Customer{% endblock %}

{% block content %}
<div class="form-container narrow">
  <h2><i class="fa fa-user-plus"></i> Add New Customer</h2>
  
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Customer / Business Name *</label>
      {{ form.name }}
    </div>
    <div class="form-group">
      <label>Customer GSTIN</label>
      {{ form.gstin }}
    </div>
    <div class="form-group">
      <label>Email Address</label>
      {{ form.email }}
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      {{ form.phone }}
    </div>
    <div class="form-group">
      <label>Business Category</label>
      {{ form.business_category }}
    </div>
    <div class="form-group">
      <label>Billing Address</label>
      {{ form.address }}
    </div>
    <div class="form-group">
      <label>Shopping / Requirement Notes</label>
      {{ form.shopping_details }}
    </div>

    <div style="margin-top: 1.5rem; text-align: right;">
      <button type="submit" class="btn-primary">
        <i class="fa fa-save"></i> Save Customer
      </button>
    </div>
  </form>
</div>
{% endblock %}
